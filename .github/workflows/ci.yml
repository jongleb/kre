name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
      - run: npm ci
      - run: opam install . --deps-only --with-test --yes
      - run: opam install ocamlformat.0.29.0 --yes
      - run: opam exec -- dune build @all
      - run: opam exec -- dune test
      - run: opam exec -- dune build @fmt
      - run: opam exec -- dune build examples/cats/bin/openapi.json
      - run: pipx run openapi-spec-validator _build/default/examples/cats/bin/openapi.json

  db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_USER: forge
          MARIADB_PASSWORD: forge
          MARIADB_DATABASE: forge_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: opam install . --deps-only --with-test --yes
      - run: opam exec -- dune build @examples/cats/db/test/db
        env:
          FORGE_TEST_DB_URL: mariadb://forge:forge@127.0.0.1:3306/forge_test
      - run: >-
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE shelter_test;
          GRANT ALL ON shelter_test.* TO 'forge'@'%';"
      - run: opam exec -- dune build @examples/shelter/test/shelter
        env:
          FORGE_TEST_SHELTER_URL: mariadb://forge:forge@127.0.0.1:3306/shelter_test

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U forge" --health-interval=5s
          --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
      - run: opam install . --deps-only --with-test --yes
      - run: opam exec -- dune build @examples/cats/postgresql/pg
        env:
          FORGE_TEST_PG_URL: postgresql://forge:forge@127.0.0.1:5432/forge_test
